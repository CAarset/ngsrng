[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsrng"
version = "0.0.1"
description = "Function-space random variables in NGSolve finite element spaces"
requires-python = ">=3.11"
dependencies = ["ngsolve>=6.2", "numpy", "scipy", "torch", "threadpoolctl"]

[project.optional-dependencies]
# Accelerator, exactly one per environment: cpu | cuda | rocm (python -m ngsrng.tuning show says which fits the
# machine). torch stays unqualified in the dependencies: the environment's project picks PyTorch's build for the device
# (env/pyproject.toml for ngsrng's own; dependents copy its torch sources, see the README). Each extra adds ngsrng's
# GPU solver: cuDSS on NVIDIA GPUs, AMG-preconditioned CG on AMD GPUs.
cpu = ["torch>=2.6"]
cuda = ["torch>=2.6", "nvmath-python[cu13]"]
# PyTorch's ROCm wheels depend on AMD's ROCm SDK packages, published on PyTorch's ROCm index rather than on PyPI; uv
# takes a package from a named index only if it is a direct dependency, so they are listed here, one device package
# per GPU architecture: keep the gfx list in step with the index (here and in [tool.uv.sources]).
rocm = [
    "torch>=2.6", "pyamg",
    "triton-rocm", "rocm[device-all,libraries]", "rocm-sdk-core", "rocm-sdk-libraries", "rocm-sdk-device-gfx908",
    "rocm-sdk-device-gfx90a", "rocm-sdk-device-gfx942", "rocm-sdk-device-gfx950", "rocm-sdk-device-gfx1010",
    "rocm-sdk-device-gfx1011", "rocm-sdk-device-gfx1012", "rocm-sdk-device-gfx1030", "rocm-sdk-device-gfx1031",
    "rocm-sdk-device-gfx1032", "rocm-sdk-device-gfx1033", "rocm-sdk-device-gfx1034", "rocm-sdk-device-gfx1035",
    "rocm-sdk-device-gfx1036", "rocm-sdk-device-gfx1100", "rocm-sdk-device-gfx1101", "rocm-sdk-device-gfx1102",
    "rocm-sdk-device-gfx1103", "rocm-sdk-device-gfx1150", "rocm-sdk-device-gfx1151", "rocm-sdk-device-gfx1152",
    "rocm-sdk-device-gfx1153", "rocm-sdk-device-gfx1200", "rocm-sdk-device-gfx1201", "rocm-sdk-device-gfx1250"
]
gpu = ["nvmath-python[cu13]"]   # deprecated name of the cuda extra's solver, kept until consumers switch to cuda
amg = ["pyamg"]                 # deprecated name of the rocm extra's solver, kept until consumers switch to rocm
bench = ["pandas", "matplotlib", "tabulate"]
test = ["pytest"]
examples = ["matplotlib", "jupyter", "anywidget"]  # examples/demo.ipynb (and the local ngsplot package)

[project.scripts]
ngsrng-calibrate = "ngsrng.calibrate:main"

[tool.setuptools.packages.find]
include = ["ngsrng*"]

[tool.setuptools.package-data]
ngsrng = ["data/*.json"]  # the shipped calibration (ngsrng/tuning.py)

# uv applies a dependency's [tool.uv.sources]: this block is read by every uv project that depends on ngsrng. So it
# holds only what the rocm extra needs from PyTorch's ROCm index (AMD's packages, scoped to that extra), never torch
# itself: torch sources here would clash with a dependent's own ("conflicting indexes for package torch"). The torch
# build per extra is chosen by the environment's project: env/pyproject.toml here, the template for dependents.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
rocm = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-core = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-libraries = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx908 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx90a = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx942 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx950 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1010 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1011 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1012 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1030 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1031 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1032 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1033 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1034 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1035 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1036 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1100 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1101 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1102 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1103 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1150 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1151 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1152 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1153 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1200 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1201 = { index = "pytorch-rocm", extra = "rocm" }
rocm-sdk-device-gfx1250 = { index = "pytorch-rocm", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["ngsrng"]
